name: Deploy Legacy Attendance

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: legacy-attendance-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Attendance to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            /var/www/sacs-legacy/deploy-legacy-app.sh attendance
